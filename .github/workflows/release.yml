# 自动发布：推 v* tag 即构建三平台并挂到 Release（T7b）
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test release gate
        run: node --test scripts/release-gate.test.mjs

      - name: Validate release tag and changelog
        id: gate
        run: |
          git fetch --no-tags origin main
          node scripts/release-gate.mjs \
            --tag "$RELEASE_TAG" \
            --changelog CHANGELOG.md \
            --main-ref origin/main

      - name: Build web
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Build binaries
        run: |
          VERSION="${RELEASE_TAG}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          mkdir -p build-bin release
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags windowsgui -ldflags "$LDFLAGS -H windowsgui" -o build-bin/evergate-windows-amd64.exe ./cmd/evergate
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o build-bin/evergate-linux-amd64   ./cmd/evergate
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o build-bin/evergate-darwin-arm64  ./cmd/evergate
          bash scripts/package-linux-release.sh "$VERSION" build-bin/evergate-linux-amd64 release
          (cd release && sha256sum evergate_*_linux_amd64.tar.gz > "evergate_${VERSION#v}_checksums.txt")

      - name: Stage npm packages
        run: node scripts/stage-npm.mjs "${RELEASE_TAG#v}" "$PWD/build-bin" "$PWD/dist-npm"

      - name: Validate staged npm packages
        run: |
          node scripts/release-gate.mjs \
            --tag "$RELEASE_TAG" \
            --changelog CHANGELOG.md \
            --main-ref origin/main \
            --staged-dir "$PWD/dist-npm"

      - name: Check npm token
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm packages
        if: steps.npm.outputs.enabled == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          VERSION="${RELEASE_TAG#v}"
          NPM_TAG="${{ steps.gate.outputs.npm_tag }}"
          WRAPPER_PKG=$(node -p "require('./dist-npm/evergate/package.json').name")
          LATEST_BEFORE=""
          if [ "$NPM_TAG" = "next" ]; then
            LATEST_BEFORE=$(npm view "$WRAPPER_PKG" dist-tags.latest 2>/dev/null || true)
          fi
          for dir in evergate-win32-x64 evergate-linux-amd64 evergate-darwin-arm64 evergate; do
            pkg=$(node -p "require('./dist-npm/$dir/package.json').name")
            if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "$pkg@$VERSION already published; skipping"
            else
              npm publish "./dist-npm/$dir" --access public --tag "$NPM_TAG"
            fi
            npm dist-tag add "$pkg@$VERSION" "$NPM_TAG" >/dev/null
          done
          deadline=$((SECONDS + 360))
          for dir in evergate-win32-x64 evergate-linux-amd64 evergate-darwin-arm64 evergate; do
            pkg=$(node -p "require('./dist-npm/$dir/package.json').name")
            while true; do
              got=$(npm view "$pkg@$VERSION" version 2>/dev/null || true)
              tagged=$(npm view "$pkg" "dist-tags.$NPM_TAG" 2>/dev/null || true)
              if [ "$got" = "$VERSION" ] && [ "$tagged" = "$VERSION" ]; then
                break
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::$pkg registry metadata did not settle (version=$got tag=$tagged)"
                exit 1
              fi
              echo "waiting for $pkg registry metadata (version=$got tag=$tagged)"
              sleep 10
            done
          done
          if [ "$NPM_TAG" = "next" ]; then
            LATEST_AFTER=$(npm view "$WRAPPER_PKG" dist-tags.latest 2>/dev/null || true)
            if [ "$LATEST_BEFORE" != "$LATEST_AFTER" ]; then
              echo "::error::prerelease moved $WRAPPER_PKG latest from $LATEST_BEFORE to $LATEST_AFTER"
              exit 1
            fi
          fi

      - name: Skip npm publish (NPM_TOKEN missing)
        if: steps.npm.outputs.enabled != 'true'
        run: echo "NPM_TOKEN is not configured; staged npm packages were not published."

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*
          body: ${{ steps.gate.outputs.body }}
          generate_release_notes: false
          prerelease: ${{ steps.gate.outputs.prerelease == 'true' }}
          make_latest: false

  windows-installer:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Refresh release tooling for dispatched rebuild
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --no-tags origin main
          git checkout origin/main -- installer/evergate.iss scripts/release-gate.mjs scripts/release-gate.test.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Windows binary
        shell: pwsh
        run: |
          npm --prefix web ci
          npm --prefix web run build
          New-Item -ItemType Directory -Force build | Out-Null
          $ldflags = "-s -w -X main.version=$env:RELEASE_TAG"
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -tags windowsgui -ldflags "$ldflags -H windowsgui" -o build/evergate.exe ./cmd/evergate
          go build -ldflags "$ldflags" -o build/evergate-console.exe ./cmd/evergate

      - name: Verify Windows GUI manifest
        shell: pwsh
        run: ./scripts/verify-windows-gui.ps1 -Gui build/evergate.exe -Console build/evergate-console.exe

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = (Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' | Select-Object -First 1).FullName
          if (-not $iscc) { throw "ISCC.exe not found" }
          $version = $env:RELEASE_TAG.TrimStart('v')
          $chineseIsl = 'C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl'
          $isccArgs = @(
            "/DAppVersion=$version"
            "/DSourceExe=$env:GITHUB_WORKSPACE\build\evergate.exe"
            "/DOutputDir=$env:GITHUB_WORKSPACE\release-installer"
          )
          if (Test-Path $chineseIsl) { $isccArgs += '/DUseChineseLanguage' }
          $isccArgs += "$env:GITHUB_WORKSPACE\installer\evergate.iss"
          & $iscc @isccArgs
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      - name: Smoke-test installer
        shell: pwsh
        run: ./scripts/smoke-installer.ps1 -SourceBinary (Resolve-Path build/evergate.exe).Path

      - name: Attach Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $installer = "release-installer/evergate_${version}_windows_amd64_setup.exe"
          if (-not (Test-Path $installer)) { throw "installer asset missing: $installer" }
          gh release upload $env:RELEASE_TAG $installer --clobber

  macos-installer:
    needs: release
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      REQUIRE_MACOS_SIGNING: "true"
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Refresh release tooling for dispatched rebuild
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --no-tags origin main
          git checkout origin/main -- scripts/build-macos-app.sh scripts/build-macos-installer.sh installer/macos

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check signing credentials
        run: |
          for name in MACOS_SIGN_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::macOS release requires secret $name"
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            echo "::error::macOS release requires MACOS_CERTIFICATE_P12 and MACOS_CERTIFICATE_PASSWORD"
            exit 1
          fi
          keychain="$RUNNER_TEMP/evergate-signing.keychain-db"
          cert="$RUNNER_TEMP/evergate-signing.p12"
          echo "$MACOS_CERTIFICATE_P12" | base64 -D > "$cert"
          security create-keychain -p "$RUNNER_TEMP" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$RUNNER_TEMP" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

      - name: Build macOS app and installer
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: arm64
          CC: clang
          CGO_CFLAGS: -arch arm64
          CGO_LDFLAGS: -arch arm64
          MACOS_SWIFT_TARGET: arm64-apple-macos11
        run: |
          npm --prefix web ci
          npm --prefix web run build
          mkdir -p build-bin release-macos
          go build -ldflags "-s -w -X main.version=$RELEASE_TAG" -o build-bin/evergate-darwin-arm64 ./cmd/evergate
          bash scripts/build-macos-installer.sh "$RELEASE_TAG" build-bin/evergate-darwin-arm64 release-macos

      - name: Attach macOS installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          installer="release-macos/evergate_${version}_macos_arm64_setup.dmg"
          test -f "$installer"
          gh release upload "$RELEASE_TAG" "$installer" --clobber

  verify-release:
    needs: [release, windows-installer, macos-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Fetch main for release gate
        run: git fetch --no-tags origin main

      - name: Verify public assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p verify
          gh release download "$RELEASE_TAG" --dir verify
          find verify -maxdepth 1 -type f -printf '%f\n' | sort > assets.txt
          node scripts/release-gate.mjs \
            --tag "$RELEASE_TAG" \
            --changelog CHANGELOG.md \
            --main-ref origin/main \
            --assets-file assets.txt
          (cd verify && sha256sum evergate_*_windows_amd64_setup.exe evergate_*_macos_arm64_setup.dmg evergate_*_linux_amd64.tar.gz > "evergate_${version}_checksums.txt")
          gh release upload "$RELEASE_TAG" "verify/evergate_${version}_checksums.txt" --clobber
          (cd verify && sha256sum -c "evergate_${version}_checksums.txt")
          if [[ "$version" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --prerelease
          else
            gh release edit "$RELEASE_TAG" --latest
          fi
