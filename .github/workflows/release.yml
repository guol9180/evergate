# 自动发布：推 v* tag 即构建三平台并挂到 Release（T7b）
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test release gate
        run: node --test scripts/release-gate.test.mjs

      - name: Validate release tag and changelog
        id: gate
        run: |
          git fetch --no-tags origin main
          node scripts/release-gate.mjs \
            --tag "$RELEASE_TAG" \
            --changelog CHANGELOG.md \
            --main-ref origin/main

      - name: Build web
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Build binaries
        run: |
          VERSION="${RELEASE_TAG}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags windowsgui -ldflags "$LDFLAGS -H windowsgui" -o release/evergate-windows-amd64.exe ./cmd/evergate
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o release/evergate-windows-amd64-console.exe ./cmd/evergate
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o release/evergate-linux-amd64   ./cmd/evergate
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o release/evergate-darwin-arm64  ./cmd/evergate
          sha256sum release/* > release/checksums.txt

      - name: Stage npm packages
        run: node scripts/stage-npm.mjs "${RELEASE_TAG#v}" "$PWD/release" "$PWD/dist-npm"

      - name: Validate staged npm packages
        run: |
          node scripts/release-gate.mjs \
            --tag "$RELEASE_TAG" \
            --changelog CHANGELOG.md \
            --main-ref origin/main \
            --staged-dir "$PWD/dist-npm"

      - name: Check npm token
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm packages
        if: steps.npm.outputs.enabled == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          VERSION="${RELEASE_TAG#v}"
          NPM_TAG="${{ steps.gate.outputs.npm_tag }}"
          WRAPPER_PKG=$(node -p "require('./dist-npm/evergate/package.json').name")
          LATEST_BEFORE=""
          if [ "$NPM_TAG" = "next" ]; then
            LATEST_BEFORE=$(npm view "$WRAPPER_PKG" dist-tags.latest 2>/dev/null || true)
          fi
          for dir in evergate-win32-x64 evergate-linux-amd64 evergate-darwin-arm64 evergate; do
            pkg=$(node -p "require('./dist-npm/$dir/package.json').name")
            if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "$pkg@$VERSION already published; skipping"
            else
              npm publish "./dist-npm/$dir" --access public --tag "$NPM_TAG"
            fi
            npm dist-tag add "$pkg@$VERSION" "$NPM_TAG" >/dev/null
          done
          deadline=$((SECONDS + 360))
          for dir in evergate-win32-x64 evergate-linux-amd64 evergate-darwin-arm64 evergate; do
            pkg=$(node -p "require('./dist-npm/$dir/package.json').name")
            while true; do
              got=$(npm view "$pkg@$VERSION" version 2>/dev/null || true)
              tagged=$(npm view "$pkg" "dist-tags.$NPM_TAG" 2>/dev/null || true)
              if [ "$got" = "$VERSION" ] && [ "$tagged" = "$VERSION" ]; then
                break
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::$pkg registry metadata did not settle (version=$got tag=$tagged)"
                exit 1
              fi
              echo "waiting for $pkg registry metadata (version=$got tag=$tagged)"
              sleep 10
            done
          done
          if [ "$NPM_TAG" = "next" ]; then
            LATEST_AFTER=$(npm view "$WRAPPER_PKG" dist-tags.latest 2>/dev/null || true)
            if [ "$LATEST_BEFORE" != "$LATEST_AFTER" ]; then
              echo "::error::prerelease moved $WRAPPER_PKG latest from $LATEST_BEFORE to $LATEST_AFTER"
              exit 1
            fi
          fi

      - name: Skip npm publish (NPM_TOKEN missing)
        if: steps.npm.outputs.enabled != 'true'
        run: echo "NPM_TOKEN is not configured; staged npm packages were not published."

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*
          body: ${{ steps.gate.outputs.body }}
          generate_release_notes: false
          prerelease: ${{ steps.gate.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.gate.outputs.prerelease != 'true' }}

  windows-installer:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Windows binary
        shell: pwsh
        run: |
          npm --prefix web ci
          npm --prefix web run build
          New-Item -ItemType Directory -Force release | Out-Null
          $ldflags = "-s -w -X main.version=$env:RELEASE_TAG"
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -tags windowsgui -ldflags "$ldflags -H windowsgui" -o release/evergate-windows-amd64.exe ./cmd/evergate

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = (Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' | Select-Object -First 1).FullName
          if (-not $iscc) { throw "ISCC.exe not found" }
          $version = $env:RELEASE_TAG.TrimStart('v')
          $chineseIsl = 'C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl'
          $languageArg = if (Test-Path $chineseIsl) { '/DUseChineseLanguage=1' } else { '/DUseChineseLanguage=0' }
          & $iscc "/DAppVersion=$version" `
            "/DSourceExe=$env:GITHUB_WORKSPACE\release\evergate-windows-amd64.exe" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\release-installer" `
            $languageArg `
            "$env:GITHUB_WORKSPACE\installer\evergate.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      - name: Attach installer and refresh checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $installer = "release-installer/evergate-setup-$version.exe"
          if (-not (Test-Path $installer)) { throw "installer asset missing: $installer" }
          gh release download $env:RELEASE_TAG --pattern checksums.txt --dir release --clobber
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          Add-Content release/checksums.txt "$hash  evergate-setup-$version.exe"
          gh release upload $env:RELEASE_TAG $installer release/checksums.txt --clobber
