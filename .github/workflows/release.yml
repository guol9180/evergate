# 自动发布：推 v* tag 即构建三平台并挂到 Release（T7b）
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build web
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags windowsgui -ldflags "$LDFLAGS -H windowsgui" -o release/evergate-windows-amd64.exe ./cmd/evergate
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o release/evergate-windows-amd64-console.exe ./cmd/evergate
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o release/evergate-linux-amd64   ./cmd/evergate
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o release/evergate-darwin-arm64  ./cmd/evergate
          sha256sum release/* > release/checksums.txt

      - name: Stage npm packages
        run: node scripts/stage-npm.mjs "${GITHUB_REF_NAME#v}" "$PWD/release" "$PWD/dist-npm"

      - name: Check npm token
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm packages
        if: steps.npm.outputs.enabled == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          VERSION="${GITHUB_REF_NAME#v}"
          for dir in evergate-win32-x64 evergate-linux-amd64 evergate-darwin-arm64 evergate; do
            pkg=$(node -p "require('./dist-npm/$dir/package.json').name")
            if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "$pkg@$VERSION already published; skipping"
            else
              npm publish "./dist-npm/$dir" --access public
            fi
          done
          for dir in evergate-win32-x64 evergate-linux-amd64 evergate-darwin-arm64 evergate; do
            pkg=$(node -p "require('./dist-npm/$dir/package.json').name")
            got=$(npm view "$pkg@$VERSION" version)
            if [ "$got" != "$VERSION" ]; then
              echo "::error::$pkg@$VERSION is missing after publish (got: $got)"
              exit 1
            fi
          done

      - name: Skip npm publish (NPM_TOKEN missing)
        if: steps.npm.outputs.enabled != 'true'
        run: echo "NPM_TOKEN is not configured; staged npm packages were not published."

      - name: Extract changelog section
        id: changelog
        run: |
          SECTION=$(awk -v ver="${GITHUB_REF_NAME}" '
            $0 == "## " ver {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md | sed '/./,$!d')
          if [ -n "$SECTION" ]; then
            {
              echo "body<<CHANGELOG_EOF"
              echo "$SECTION"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Found changelog section for ${GITHUB_REF_NAME}"
          else
            echo "No changelog section for ${GITHUB_REF_NAME}; release body falls back to generated notes"
          fi

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true

  windows-installer:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Windows binary
        shell: pwsh
        run: |
          npm --prefix web ci
          npm --prefix web run build
          New-Item -ItemType Directory -Force release | Out-Null
          $ldflags = "-s -w -X main.version=$env:GITHUB_REF_NAME"
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -tags windowsgui -ldflags "$ldflags -H windowsgui" -o release/evergate-windows-amd64.exe ./cmd/evergate

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = (Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' | Select-Object -First 1).FullName
          if (-not $iscc) { throw "ISCC.exe not found" }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & $iscc "/DAppVersion=$version" `
            "/DSourceExe=$env:GITHUB_WORKSPACE\release\evergate-windows-amd64.exe" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\release-installer" `
            "$env:GITHUB_WORKSPACE\installer\evergate.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      - name: Attach installer and refresh checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $installer = "release-installer/evergate-setup-$version.exe"
          if (-not (Test-Path $installer)) { throw "installer asset missing: $installer" }
          gh release download $env:GITHUB_REF_NAME --pattern checksums.txt --dir release --clobber
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          Add-Content release/checksums.txt "$hash  evergate-setup-$version.exe"
          gh release upload $env:GITHUB_REF_NAME $installer release/checksums.txt --clobber
