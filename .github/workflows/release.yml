# 自动发布：推 v* tag 即构建三平台并挂到 Release（T7b）
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build web
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o release/evergate-windows-amd64.exe ./cmd/evergate
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o release/evergate-linux-amd64   ./cmd/evergate
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o release/evergate-darwin-arm64  ./cmd/evergate
          sha256sum release/* > release/checksums.txt

      - name: Stage npm packages
        run: node scripts/stage-npm.mjs "${GITHUB_REF_NAME#v}" "$PWD/release" "$PWD/dist-npm"

      - name: Check npm token
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm packages
        if: steps.npm.outputs.enabled == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          VERSION="${GITHUB_REF_NAME#v}"
          for dir in evergate-win32-x64 evergate-linux-amd64 evergate-darwin-arm64 evergate; do
            pkg=$(node -p "require('./dist-npm/$dir/package.json').name")
            if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "$pkg@$VERSION already published; skipping"
            else
              npm publish "./dist-npm/$dir" --access public
            fi
          done

      - name: Skip npm publish (NPM_TOKEN missing)
        if: steps.npm.outputs.enabled != 'true'
        run: echo "NPM_TOKEN is not configured; staged npm packages were not published."

      - name: Extract changelog section
        id: changelog
        run: |
          SECTION=$(awk -v ver="${GITHUB_REF_NAME}" '
            $0 == "## " ver {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md)
          if [ -n "$SECTION" ]; then
            {
              echo "body<<CHANGELOG_EOF"
              echo "$SECTION"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Found changelog section for ${GITHUB_REF_NAME}"
          else
            echo "No changelog section for ${GITHUB_REF_NAME}; release body falls back to generated notes"
          fi

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
