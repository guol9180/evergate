openapi: 3.0.3
info:
  title: EverGate Downstream API
  version: 0.6.0
  description: |
    EverGate 对客户端暴露的下游接口。四种协议共用同一套下游令牌鉴权、路由调度、key 池与重试链路。
    本文件描述公共边界（鉴权、路径、流式语义、错误体），请求/响应字段以各协议官方 schema 为准，
    EverGate 只做鉴权改写、base_url 改写与模型映射，原生渠道原样转发 JSON / SSE。
servers:
  - url: http://localhost:8787
    description: 默认本地监听（设置 server.base_path 后路径需加前缀）
security:
  - bearerAuth: []
tags:
  - name: openai
    description: OpenAI Chat Completions / Responses / Models
  - name: anthropic
    description: Anthropic Messages
  - name: gemini
    description: Google Gemini generateContent
paths:
  /v1/chat/completions:
    post:
      tags: [openai]
      summary: Chat Completions（非流式 / 流式）
      description: |
        `stream: true` 时返回 `text/event-stream`，以 `data: [DONE]` 结束；空闲保活发送协议内合法的空增量帧。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: JSON 响应或 SSE 流
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericObject' }
            text/event-stream:
              schema: { type: string }
        default:
          $ref: '#/components/responses/Error'
  /v1/responses:
    post:
      tags: [openai]
      summary: OpenAI Responses API（非流式 / 流式）
      description: |
        渠道声明原生 Responses 时仅改写鉴权、base_url 与模型映射后原样转发；
        否则转换为 Chat Completions（R→CC 桥接），不可桥接的状态字段显式 400。
        流式事件以 `response.completed` / `response.failed` 结束，无 `[DONE]`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenericObject' }
      responses:
        '200':
          description: JSON 响应或 SSE 事件流
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericObject' }
            text/event-stream:
              schema: { type: string }
        default:
          $ref: '#/components/responses/Error'
  /v1/models:
    get:
      tags: [openai]
      summary: 当前令牌可见的模型列表
      description: 合并全部启用渠道的对外模型名并去重；按令牌「允许模型」过滤。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OpenAI 风格列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelList' }
        default:
          $ref: '#/components/responses/Error'
  /v1/messages:
    post:
      tags: [anthropic]
      summary: Anthropic Messages（非流式 / 流式）
      description: |
        鉴权同时接受 `Authorization: Bearer` 与 `x-api-key`；上游统一注入 `x-api-key`，
        透传 `anthropic-version` / `anthropic-beta`。流式以 `message_stop` 事件 + EOF 结束，`ping` 原样转发，无 `[DONE]`。
        渠道未声明原生 Anthropic 时 M→CC 桥接；`thinking` / `cache_control` 等不可等价字段显式 400。
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenericObject' }
      responses:
        '200':
          description: JSON 响应或 SSE 事件流
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericObject' }
            text/event-stream:
              schema: { type: string }
        default:
          $ref: '#/components/responses/Error'
  /v1/messages/count_tokens:
    post:
      tags: [anthropic]
      summary: 估算 Messages 请求 token 数
      description: 仅渠道声明原生 Anthropic 时可用，否则返回 400 `messages_native_required`。
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenericObject' }
      responses:
        '200':
          description: |
            Anthropic 风格 `{ "input_tokens": n }`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericObject' }
        default:
          $ref: '#/components/responses/Error'
  /v1beta/models/{model}:generateContent:
    post:
      tags: [gemini]
      summary: Gemini generateContent（非流式）
      description: 模型位于路径；禁止 `?key=`（返回 400 `api_key_in_query`），使用 `x-goog-api-key` 头。原生渠道透传 `systemInstruction` / `safetySettings` / `tools` / `generationConfig`。
      security:
        - googApiKey: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ModelPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenericObject' }
      responses:
        '200':
          description: Gemini 风格 JSON
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericObject' }
        default:
          $ref: '#/components/responses/Error'
  /v1beta/models/{model}:streamGenerateContent:
    post:
      tags: [gemini]
      summary: Gemini streamGenerateContent（SSE）
      description: data-only SSE，无 `[DONE]`，以 EOF 终止；usage 输出含 `toolUsePromptTokenCount`，输出含 `thoughtsTokenCount`。
      security:
        - googApiKey: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ModelPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenericObject' }
      responses:
        '200':
          description: SSE 事件流
          content:
            text/event-stream:
              schema: { type: string }
        default:
          $ref: '#/components/responses/Error'
  /v1beta/models/{model}:countTokens:
    post:
      tags: [gemini]
      summary: Gemini countTokens
      description: 仅渠道声明原生 Gemini 时可用，否则返回 400 `gemini_native_required`。
      security:
        - googApiKey: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ModelPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenericObject' }
      responses:
        '200':
          description: |
            `{ "totalTokens": n }`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericObject' }
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 管理台「令牌管理」创建的下游令牌（`eg-...`）
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: Anthropic 客户端常用；与 Bearer 等价
    googApiKey:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: Gemini 客户端常用；与 Bearer 等价
  parameters:
    ModelPath:
      name: model
      in: path
      required: true
      schema: { type: string }
      description: 对外模型名（经 model_mapping 映射到上游模型）
  responses:
    Error:
      description: 统一 OpenAI 格式错误体；全部渠道耗尽返回 503
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code]
          properties:
            message: { type: string }
            type: { type: string, example: invalid_request_error }
            code:
              type: string
              description: |
                常见取值：`invalid_token`（401）、`token_disabled` / `token_expired`（401）、
                `ip_not_allowed` / `model_not_allowed`（403）、`quota_exceeded`（429）、
                `channel_exhausted`（503）、`*_native_required`（400，需渠道声明原生能力）、
                `api_key_in_query`（400，Gemini 禁止 ?key=）
      example:
        error: { message: token disabled, type: invalid_request_error, code: token_disabled }
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string, description: 对外模型名 }
        messages:
          type: array
          items: { $ref: '#/components/schemas/GenericObject' }
        stream: { type: boolean, default: false }
        stream_options: { $ref: '#/components/schemas/GenericObject' }
        tools:
          type: array
          items: { $ref: '#/components/schemas/GenericObject' }
        temperature: { type: number }
        max_tokens: { type: integer }
      additionalProperties: true
    ModelList:
      type: object
      properties:
        object: { type: string, example: list }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              object: { type: string, example: model }
              owned_by: { type: string, example: evergate }
    GenericObject:
      type: object
      description: 以各协议官方 schema 为准；EverGate 原样转发（仅改写鉴权 / base_url / 模型）
      additionalProperties: true
